name: Validate Bloom
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: Package incremented build
        run: npm run package:build -- --build-number "$GITHUB_RUN_NUMBER" --build-attempt "$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@v4
        with:
          name: bloom-vsix-${{ github.run_number }}-${{ github.run_attempt }}
          path: 'bloom-highlighter-*+build.${{ github.run_number }}.attempt.${{ github.run_attempt }}.vsix'
