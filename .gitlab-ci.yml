image: node:22

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - validate

validate:
  stage: validate
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm test
    - npm run lint
    - npm run package:build
  artifacts:
    paths:
      - 'bloom-highlighter-*+build.$CI_PIPELINE_IID.attempt.1.vsix'
    expire_in: 1 week
